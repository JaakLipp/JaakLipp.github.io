name: Build & deploy

on:
  push:
    branches: [main]
  # Write a post from anywhere: open an issue with the `log` label.
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened, deleted]
  # Other repos can ping this one when they ship (see README).
  repository_dispatch:
    types: [project-update]
  # Pick up new GitHub activity every day at 09:17 UTC.
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

# Nothing by default; each job asks for only what it needs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # For issue events, only rebuild when the issue is (or was) a log post by the owner.
    if: >-
      github.event_name != 'issues' ||
      (github.event.issue.user.login == github.repository_owner &&
       (contains(github.event.issue.labels.*.name, 'log') || github.event.label.name == 'log'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      # Actions are pinned to full commit SHAs (tag in the comment) so a moved tag can't change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Build
        run: node scripts/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_OWNER: ${{ github.repository_owner }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # GitHub turns off scheduled workflows in public repos after 60 days without
  # activity. Re-enabling the workflow on each scheduled run keeps the daily rebuild alive.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
